name: Daily Product Trend Sync

on:
  schedule:
    # Runs every day at 6:00 AM UTC (adjust hour as needed)
    - cron: '0 9 * * '
  workflow_dispatch: # Allows you to manually trigger it anytime via GitHub UI

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install supabase requests

      - name: Run Trend Importer Script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python scraper.py
